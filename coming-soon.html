<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Coming Soon - Saasify AI</title>
    <!-- ThemeForest Standard: Local CSS -->
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-neutral-950 text-white min-h-screen flex flex-col items-center justify-center font-sans p-4 relative overflow-hidden">
    <!-- Background Glow -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-blue-600/20 blur-[100px] rounded-full -z-10"></div>

    <div class="text-center max-w-2xl mx-auto z-10">
        <span class="inline-block px-3 py-1 bg-neutral-800 rounded-full text-xs font-semibold tracking-wider mb-6">LAUNCHING SOON</span>
        <h1 class="text-5xl md:text-7xl font-bold mb-6 tracking-tight">Something <span class="text-blue-500">amazing</span> is coming.</h1>
        <p class="text-neutral-400 text-lg mb-12">We are building the next generation of AI tools. Be the first to know when we go live.</p>

        <!-- Countdown -->
        <div id="countdown" class="grid grid-cols-4 gap-4 max-w-lg mx-auto mb-12">
            <div class="bg-neutral-900 p-4 rounded-xl border border-neutral-800"><span id="days" class="text-3xl font-bold block">00</span><span class="text-xs text-neutral-500 uppercase">Days</span></div>
            <div class="bg-neutral-900 p-4 rounded-xl border border-neutral-800"><span id="hours" class="text-3xl font-bold block">00</span><span class="text-xs text-neutral-500 uppercase">Hours</span></div>
            <div class="bg-neutral-900 p-4 rounded-xl border border-neutral-800"><span id="minutes" class="text-3xl font-bold block">00</span><span class="text-xs text-neutral-500 uppercase">Mins</span></div>
            <div class="bg-neutral-900 p-4 rounded-xl border border-neutral-800"><span id="seconds" class="text-3xl font-bold block">00</span><span class="text-xs text-neutral-500 uppercase">Secs</span></div>
        </div>

        <form class="flex gap-2 max-w-sm mx-auto">
            <input type="email" placeholder="Enter your email" class="flex-1 bg-neutral-900 border border-neutral-700 text-white px-4 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button class="bg-blue-600 hover:bg-blue-500 px-6 py-3 rounded-lg font-bold">Notify Me</button>
        </form>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
