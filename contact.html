<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us - Saasify AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- ThemeForest Standard: Local CSS -->
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-white dark:bg-neutral-950 text-neutral-900 dark:text-white font-sans">
    <div class="min-h-screen grid lg:grid-cols-2">
        <!-- Left: Info -->
        <div class="bg-neutral-900 text-white p-12 lg:p-24 flex flex-col justify-between">
            <div>
                <a href="index.html" class="font-display font-bold text-2xl mb-12 block">Saasify.ai</a>
                <h1 class="text-4xl lg:text-5xl font-display font-bold mb-6">Let's build something great together.</h1>
                <p class="text-neutral-400 text-lg">We'd love to hear from you. Our friendly team is always here to chat.</p>
            </div>
            <div class="space-y-6 mt-12">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-full bg-neutral-800 flex items-center justify-center">📧</div>
                    <div>
                        <p class="font-medium">Chat to us</p>
                        <p class="text-neutral-400 text-sm">hello@saasify.ai</p>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-full bg-neutral-800 flex items-center justify-center">📍</div>
                    <div>
                        <p class="font-medium">Visit us</p>
                        <p class="text-neutral-400 text-sm">100 Smith St, Collingwood VIC 3066</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right: Form -->
        <div class="p-12 lg:p-24 flex items-center justify-center bg-white dark:bg-neutral-950">
            <form class="w-full max-w-md space-y-6">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-2">First name</label>
                        <input type="text" class="w-full px-4 py-3 rounded-lg border border-neutral-300 dark:border-neutral-700 dark:bg-neutral-900 focus:ring-2 focus:ring-primary-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2">Last name</label>
                        <input type="text" class="w-full px-4 py-3 rounded-lg border border-neutral-300 dark:border-neutral-700 dark:bg-neutral-900 focus:ring-2 focus:ring-primary-500 outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">Email</label>
                    <input type="email" class="w-full px-4 py-3 rounded-lg border border-neutral-300 dark:border-neutral-700 dark:bg-neutral-900 focus:ring-2 focus:ring-primary-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">Message</label>
                    <textarea rows="4" class="w-full px-4 py-3 rounded-lg border border-neutral-300 dark:border-neutral-700 dark:bg-neutral-900 focus:ring-2 focus:ring-primary-500 outline-none"></textarea>
                </div>
                <button type="submit" class="w-full py-3 px-6 bg-primary-600 hover:bg-primary-500 text-white rounded-lg font-medium shadow-lg shadow-primary-500/30 transition-all">Send Message</button>
            </form>
        </div>
    </div>
</body>
</html>
