<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - Saasify AI</title>
    <!-- ThemeForest Standard: Local CSS -->
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-neutral-50 dark:bg-neutral-950 flex items-center justify-center min-h-screen font-sans">
    <div class="max-w-md w-full bg-white dark:bg-neutral-900 p-8 rounded-2xl shadow-xl border border-neutral-200 dark:border-neutral-800">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-neutral-900 dark:text-white">Reset Password</h1>
            <p class="text-neutral-500 text-sm mt-2">Enter your email and we'll send you instructions.</p>
        </div>
        <form class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-1">Email address</label>
                <input type="email" required class="w-full px-3 py-2 border rounded-lg dark:bg-neutral-800 dark:border-neutral-700 dark:text-white focus:ring-2 focus:ring-primary-600 outline-none">
            </div>
            <button class="w-full py-2.5 bg-primary-600 hover:bg-primary-700 text-white rounded-lg font-medium transition">Send Reset Link</button>
        </form>
        <div class="mt-6 text-center">
            <a href="login.html" class="text-sm text-neutral-500 hover:text-neutral-900 dark:hover:text-white">Back to Login</a>
        </div>
    </div>
</body>
</html>
