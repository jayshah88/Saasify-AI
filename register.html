<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up | Saasify AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- ThemeForest Standard: Local CSS -->
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-neutral-50 dark:bg-neutral-950 font-sans text-neutral-900 dark:text-white">
    <div class="min-h-screen flex items-center justify-center py-12 px-4">
        <div class="max-w-md w-full space-y-8 bg-white dark:bg-neutral-900 p-8 rounded-2xl shadow-xl border border-neutral-200 dark:border-neutral-800">
            <div class="text-center">
                <a href="index.html" class="inline-block text-2xl font-bold font-display mb-2">Saasify.ai</a>
                <h2 class="text-3xl font-bold font-display">Create your account</h2>
                <p class="mt-2 text-sm text-neutral-500">Already have an account? <a href="login.html" class="text-primary-600 font-medium">Log in</a></p>
            </div>
            
            <form class="mt-8 space-y-6" id="registerForm">
                <div class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium mb-1">First Name</label>
                            <input type="text" required class="w-full px-3 py-2 border rounded-md dark:bg-neutral-800 dark:border-neutral-700">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Last Name</label>
                            <input type="text" required class="w-full px-3 py-2 border rounded-md dark:bg-neutral-800 dark:border-neutral-700">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Email address</label>
                        <input type="email" required class="w-full px-3 py-2 border rounded-md dark:bg-neutral-800 dark:border-neutral-700">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Password</label>
                        <input type="password" required class="w-full px-3 py-2 border rounded-md dark:bg-neutral-800 dark:border-neutral-700">
                    </div>
                </div>

                <div class="flex items-center">
                    <input id="terms" type="checkbox" required class="h-4 w-4 text-primary-600 rounded">
                    <label for="terms" class="ml-2 block text-sm text-neutral-500">I agree to the <a href="#" class="text-primary-600">Terms</a> and <a href="#" class="text-primary-600">Privacy Policy</a></label>
                </div>

                <button type="submit" class="w-full py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-primary-600 hover:bg-primary-700">
                    Sign up
                </button>
            </form>
        </div>
    </div>
</body>
</html>
