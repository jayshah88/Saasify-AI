<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Roadmap - Saasify AI</title>
    <!-- ThemeForest Standard: Local CSS -->
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-neutral-50 dark:bg-neutral-950 font-sans text-neutral-900 dark:text-white">
    <nav class="p-4 bg-white dark:bg-neutral-900 border-b border-neutral-200 dark:border-neutral-800">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="index.html" class="font-bold text-xl">Saasify Roadmap</a>
            <a href="index.html" class="text-sm text-neutral-500">Back Home</a>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 py-12">
        <div class="grid md:grid-cols-3 gap-8">
            <!-- Column 1 -->
            <div>
                <h3 class="font-bold text-lg mb-4 flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-blue-500"></span> Planned
                </h3>
                <div class="space-y-4">
                    <div class="bg-white dark:bg-neutral-900 p-4 rounded-lg shadow-sm border border-neutral-200 dark:border-neutral-800">
                        <h4 class="font-bold mb-2">Mobile App</h4>
                        <p class="text-sm text-neutral-500">Native iOS and Android applications.</p>
                    </div>
                    <div class="bg-white dark:bg-neutral-900 p-4 rounded-lg shadow-sm border border-neutral-200 dark:border-neutral-800">
                        <h4 class="font-bold mb-2">Dark Mode V2</h4>
                        <p class="text-sm text-neutral-500">High contrast options and custom themes.</p>
                    </div>
                </div>
            </div>
            <!-- Column 2 -->
            <div>
                <h3 class="font-bold text-lg mb-4 flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-yellow-500"></span> In Progress
                </h3>
                <div class="space-y-4">
                    <div class="bg-white dark:bg-neutral-900 p-4 rounded-lg shadow-sm border border-neutral-200 dark:border-neutral-800">
                        <h4 class="font-bold mb-2">API Rate Limiting</h4>
                        <p class="text-sm text-neutral-500">Per-user granular controls for API usage.</p>
                        <div class="mt-3 h-1 w-full bg-neutral-100 rounded-full overflow-hidden"><div class="h-full bg-yellow-500 w-2/3"></div></div>
                    </div>
                </div>
            </div>
            <!-- Column 3 -->
            <div>
                <h3 class="font-bold text-lg mb-4 flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-green-500"></span> Complete
                </h3>
                <div class="space-y-4">
                    <div class="bg-white dark:bg-neutral-900 p-4 rounded-lg shadow-sm border border-neutral-200 dark:border-neutral-800 opacity-75">
                        <h4 class="font-bold mb-2 line-through decoration-neutral-400">Gemini Integration</h4>
                        <p class="text-sm text-neutral-500">Full support for Google's latest models.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
