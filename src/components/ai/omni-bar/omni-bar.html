<div id="omni-bar" class="fixed inset-0 z-[100] hidden" role="dialog" aria-modal="true" aria-labelledby="omni-bar-label">
    <!-- Backdrop -->
    <div id="omni-bar-backdrop" class="absolute inset-0 dark:bg-slate-950/80 backdrop-blur-sm"></div>
    
    <!-- Modal Panel -->
    <div class="relative max-w-2xl mx-auto mt-[10vh] px-4">
        <div class="dark:bg-slate-900 border dark:border-white/10 rounded-2xl shadow-2xl overflow-hidden flex flex-col">
            <!-- Search Header -->
            <div class="flex items-center px-4 border-b dark:border-white/5 dark:bg-slate-900/50">
                <svg class="w-5 h-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
                <input type="text" id="omni-bar-input" 
                    class="w-full bg-transparent border-none focus:ring-0 dark:text-white placeholder-slate-500 py-4 px-3 text-lg outline-none" 
                    placeholder="Search pages or ask AI..."
                    autocomplete="off">
                <kbd class="hidden sm:block px-2 py-1 bg-slate-800 text-slate-400 text-[10px] font-bold rounded border border-white/10">ESC</kbd>
            </div>

            <!-- Results List -->
            <div id="omni-bar-results" class="max-h-[60vh] overflow-y-auto p-2 space-y-1 custom-scrollbar">
                <!-- Static Suggestions (Example) -->
                <div class="px-3 py-2 text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-widest">Suggestions</div>
                <button class="omni-item w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 transition-colors hover:bg-white/5 active:bg-white/10 group" data-url="dashboard/index.html">
                    <div class="w-8 h-8 rounded-lg bg-indigo-600/20 flex items-center justify-center dark:text-indigo-400 group-hover:scale-110 transition-transform">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
                    </div>
                    <div>
                        <div class="text-sm font-medium text-white">Dashboard</div>
                        <div class="text-xs text-slate-500 dark:text-slate-400">Jump to your analytics overview</div>
                    </div>
                </button>
                <button class="omni-item w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 transition-colors hover:bg-white/5 active:bg-white/10 group" data-action="ask-ai">
                    <div class="w-8 h-8 rounded-lg bg-emerald-500/20 flex items-center justify-center text-emerald-400 group-hover:scale-110 transition-transform">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
                    </div>
                    <div>
                        <div class="text-sm font-medium text-white">Ask AI Assistant</div>
                        <div class="text-xs text-slate-500 dark:text-slate-400">Query your data using natural language</div>
                    </div>
                </button>
            </div>

            <!-- Footer -->
            <div class="px-4 py-3 border-t dark:border-white/5 dark:bg-slate-900/80 flex items-center justify-between text-[10px] text-slate-500 dark:text-slate-400">
                <div class="flex gap-4">
                    <span class="flex items-center gap-1"><kbd class="px-1.5 py-0.5 bg-slate-800 rounded border dark:border-white/10 text-white">↑↓</kbd> to navigate</span>
                    <span class="flex items-center gap-1"><kbd class="px-1.5 py-0.5 bg-slate-800 rounded border dark:border-white/10 text-white">Enter</kbd> to select</span>
                </div>
                <div class="font-medium">Powered by Saasify AI</div>
            </div>
        </div>
    </div>
</div>
