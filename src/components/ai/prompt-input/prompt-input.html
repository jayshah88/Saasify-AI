<div class="prompt-input-container w-full max-w-3xl mx-auto relative group">
    <!-- Glow Effect -->
    <div class="absolute -inset-0.5 bg-gradient-to-r from-indigo-500 to-purple-500 rounded-2xl blur opacity-20 group-hover:opacity-40 transition duration-500"></div>
    
    <div class="relative bg-white dark:bg-slate-900 border border-slate-200 dark:border-white/10 rounded-xl p-4 shadow-2xl flex flex-col gap-3">
        <!-- Textarea -->
        <textarea 
            id="ai-prompt-textarea"
            class="w-full bg-transparent border-none focus:ring-0 text-slate-900 dark:text-white placeholder-slate-500 resize-none outline-none text-base leading-relaxed custom-scrollbar"
            placeholder="Ask anything (e.g., 'Generate a SaaS landing page copy')..."
            rows="1"
            style="min-height: 24px; max-height: 200px;"
        ></textarea>

        <!-- Actions Footer -->
        <div class="flex justify-between items-center pt-2 border-t border-slate-100 dark:border-white/5">
            <!-- Context Tools (Optional Expansion) -->
            <div class="flex gap-2">
                <button class="p-2 text-slate-400 hover:text-slate-900 dark:text-white hover:bg-white/5 rounded-lg transition-colors" title="Attach File">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" /></svg>
                </button>
                <button class="p-2 text-slate-400 hover:text-slate-900 dark:text-white hover:bg-white/5 rounded-lg transition-colors" title="Voice Input">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" /></svg>
                </button>
            </div>

            <!-- Generate Button -->
            <button 
                id="ai-generate-btn"
                class="bg-indigo-600 hover:bg-indigo-500 text-slate-900 text-white px-4 py-2 rounded-lg font-medium flex items-center gap-2 transition-all active:scale-95 shadow-glow-primary disabled:opacity-50 disabled:cursor-not-allowed">
                <span>Generate</span>
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
                </svg>
            </button>
        </div>
    </div>
</div>
