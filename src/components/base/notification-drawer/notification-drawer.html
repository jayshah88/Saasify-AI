<div id="notification-drawer" class="fixed inset-0 z-[100] hidden">
    <!-- Backdrop -->
    <div id="notification-backdrop" class="absolute inset-0 bg-slate-950/20 backdrop-blur-sm transition-opacity duration-300"></div>
    
    <!-- Drawer -->
    <div class="absolute inset-y-0 right-0 w-full max-w-sm bg-white dark:bg-slate-900 shadow-2xl border-l border-slate-200 dark:border-white/10 flex flex-col transform translate-x-full transition-transform duration-300 ease-out" id="notification-panel">
        <div class="p-6 border-b border-slate-100 dark:border-white/5 flex items-center justify-between">
            <div>
                <h3 class="text-lg font-bold text-slate-900 dark:text-white">Notifications</h3>
                <p class="text-xs text-slate-500">You have 2 unread messages</p>
            </div>
            <button id="close-notification" class="p-2 hover:bg-slate-100 dark:hover:bg-white/5 rounded-lg text-slate-400 transition-colors">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>
        </div>

        <div class="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar">
            <!-- Notification Item -->
            <div class="p-4 rounded-xl bg-slate-50 dark:bg-white/5 border border-slate-100 dark:border-white/5 group hover:border-indigo-500/30 transition-all cursor-pointer">
                <div class="flex gap-3">
                    <div class="w-10 h-10 rounded-full bg-indigo-500/10 text-indigo-600 flex items-center justify-center shrink-0">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
                    </div>
                    <div class="flex-1">
                        <div class="flex justify-between items-start">
                            <h4 class="text-sm font-bold text-slate-900 dark:text-white">Agent Task Complete</h4>
                            <span class="text-[10px] text-slate-400">2m ago</span>
                        </div>
                        <p class="text-xs text-slate-500 mt-1">Coder-Agent successfully refactored the backend architecture.</p>
                    </div>
                </div>
            </div>

            <!-- Notification Item -->
            <div class="p-4 rounded-xl bg-slate-50 dark:bg-white/5 border border-slate-100 dark:border-white/5 group hover:border-indigo-500/30 transition-all cursor-pointer">
                <div class="flex gap-3">
                    <div class="w-10 h-10 rounded-full bg-emerald-500/10 text-emerald-500 flex items-center justify-center shrink-0">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    </div>
                    <div class="flex-1">
                        <div class="flex justify-between items-start">
                            <h4 class="text-sm font-bold text-slate-900 dark:text-white">Credits Added</h4>
                            <span class="text-[10px] text-slate-400">1h ago</span>
                        </div>
                        <p class="text-xs text-slate-500 mt-1">Your monthly allowance of 100k tokens has been credited.</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="p-4 border-t border-slate-100 dark:border-white/5">
            <button class="w-full py-3 bg-slate-100 dark:bg-white/5 text-slate-600 dark:text-slate-300 rounded-xl text-sm font-bold hover:bg-indigo-600 hover:text-white transition-all">
                Mark all as read
            </button>
        </div>
    </div>
</div>
