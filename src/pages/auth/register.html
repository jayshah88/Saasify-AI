<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up | Saasify AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <script type="module" src='../../main.js'></script>
  <link rel='stylesheet' href='../../compiled-style.css'>
  <script>(function(){const t=localStorage.getItem('saasify-theme')||'light';if(t==='dark')document.documentElement.classList.add('dark');else document.documentElement.classList.remove('dark')})();</script>
</head>

<body
    class="bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-50 antialiased transition-colors duration-300 font-sans">

    <div class="noise-overlay"></div>
    <main class="min-h-screen flex items-center justify-center py-12 px-4 bg-white dark:bg-slate-950 relative z-10">
        <div
            class="max-w-md w-full space-y-8 bg-white dark:bg-slate-900/50 backdrop-blur-xl p-8 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-800">
            <div class="text-center">
                <a href="../index.html" class="inline-flex items-center gap-2 mb-6 group">
                    <div
                        class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-slate-600 flex items-center justify-center dark:text-white font-bold text-xl group-hover:scale-105 transition-transform">
                        S</div>
                    <span class="font-display font-bold text-xl text-slate-900 dark:text-white">Saasify<span
                            class="text-indigo-500">.ai</span></span>
                </a>
                <h2 class="mt-2 text-3xl font-display font-bold text-slate-900 dark:text-white">Create your account
                </h2>
                <p class="mt-2 text-sm text-slate-600 dark:text-slate-400">Already have an account? <a
                        href="login.html" class="font-medium text-indigo-600 hover:text-indigo-500">Log in</a></p>
            </div>

            <form class="mt-8 space-y-6" id="registerForm">
                <div class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium mb-1">First Name</label>
                            <input type="text" required
                                class="mt-1 block w-full px-3 py-2 border border-slate-300 dark:border-slate-700 rounded-md shadow-sm placeholder-slate-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 dark:bg-slate-800 dark:text-white sm:text-sm transition-colors">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Last Name</label>
                            <input type="text" required
                                class="mt-1 block w-full px-3 py-2 border border-slate-300 dark:border-slate-700 rounded-md shadow-sm placeholder-slate-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 dark:bg-slate-800 dark:text-white sm:text-sm transition-colors">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Email address</label>
                        <input type="email" required
                            class="mt-1 block w-full px-3 py-2 border border-slate-300 dark:border-slate-700 rounded-md shadow-sm placeholder-slate-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 dark:bg-slate-800 dark:text-white sm:text-sm transition-colors">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Password</label>
                        <input type="password" required
                            class="mt-1 block w-full px-3 py-2 border border-slate-300 dark:border-slate-700 rounded-md shadow-sm placeholder-slate-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 dark:bg-slate-800 dark:text-white sm:text-sm transition-colors">
                    </div>
                </div>

                <div class="flex items-center">
                    <input id="terms" type="checkbox" required class="h-4 w-4 text-indigo-600 rounded">
                    <label for="terms" class="ml-2 block text-sm text-slate-500 dark:text-slate-400">I agree to the <a href="../terms.html"
                            class="text-indigo-600">Terms</a> and <a href="../privacy.html" class="text-indigo-600">Privacy
                            Policy</a></label>
                </div>

                <button type="submit"
                    class="group relative w-full flex justify-center py-2.5 px-4 border border-transparent text-sm font-medium rounded-lg dark:text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 shadow-lg shadow-indigo-500/30 transition-all duration-200">
                    Sign up
                </button>
            </form>
        </div>
    </main>
</body>

</html>
