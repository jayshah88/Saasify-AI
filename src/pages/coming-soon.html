<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Coming Soon - Saasify AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <!-- ThemeForest Standard: Local CSS -->
    <link href="css/style.css" rel="stylesheet">
</head>

<body
    class="bg-white dark:bg-neutral-950 text-neutral-900 dark:text-white min-h-screen flex flex-col items-center justify-center font-sans p-4 relative overflow-hidden selection:bg-primary-500/30">

    <div class="noise-overlay"></div>

    <!-- Background Glow -->
    <div
        class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-primary-500/20 blur-[120px] rounded-full -z-10 animate-pulse-slow">
    </div>

    <div class="text-center max-w-2xl mx-auto z-10 animate-fade-in-up">
        <span
            class="inline-block px-4 py-1.5 bg-primary-500/10 text-primary-600 dark:text-primary-400 rounded-full text-xs font-bold tracking-widest mb-8 border border-primary-500/20 uppercase">Coming
            Very Soon</span>
        <h1 class="text-5xl md:text-7xl font-display font-black mb-6 tracking-tight">Something <span
                class="text-primary-500">incredible</span> is building.</h1>
        <p class="text-neutral-500 dark:text-neutral-400 text-lg md:text-xl mb-12 max-w-xl mx-auto">We're crafting the
            future of enterprise AI. Be the first to experience the revolution.</p>

        <!-- Countdown -->
        <div id="countdown" class="grid grid-cols-4 gap-4 max-w-xl mx-auto mb-12">
            <div
                class="bg-white/5 dark:bg-neutral-900/50 backdrop-blur-md p-6 rounded-2xl border border-neutral-200 dark:border-neutral-800 shadow-xl">
                <span id="days" class="text-4xl font-display font-black block text-primary-500">00</span>
                <span class="text-[10px] text-neutral-500 uppercase tracking-widest font-bold">Days</span>
            </div>
            <div
                class="bg-white/5 dark:bg-neutral-900/50 backdrop-blur-md p-6 rounded-2xl border border-neutral-200 dark:border-neutral-800 shadow-xl">
                <span id="hours" class="text-4xl font-display font-black block text-primary-500">00</span>
                <span class="text-[10px] text-neutral-500 uppercase tracking-widest font-bold">Hours</span>
            </div>
            <div
                class="bg-white/5 dark:bg-neutral-900/50 backdrop-blur-md p-6 rounded-2xl border border-neutral-200 dark:border-neutral-800 shadow-xl">
                <span id="minutes" class="text-4xl font-display font-black block text-primary-500">00</span>
                <span class="text-[10px] text-neutral-500 uppercase tracking-widest font-bold">Mins</span>
            </div>
            <div
                class="bg-white/5 dark:bg-neutral-900/50 backdrop-blur-md p-6 rounded-2xl border border-neutral-200 dark:border-neutral-800 shadow-xl">
                <span id="seconds" class="text-4xl font-display font-black block text-primary-500">00</span>
                <span class="text-[10px] text-neutral-500 uppercase tracking-widest font-bold">Secs</span>
            </div>
        </div>

        <form class="flex flex-col sm:flex-row gap-3 max-w-md mx-auto">
            <input type="email" placeholder="Enter your email address"
                class="flex-1 bg-white dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 text-neutral-900 dark:text-white px-6 py-4 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-500 transition-all shadow-lg placeholder:text-neutral-400">
            <button
                class="bg-primary-600 hover:bg-primary-700 text-white px-8 py-4 rounded-xl font-bold shadow-xl shadow-primary-500/30 transition-all hover:scale-105 active:scale-95">Notify
                Me</button>
        </form>
    </div>
    <script src="js/main.js"></script>
</body>

</html>
