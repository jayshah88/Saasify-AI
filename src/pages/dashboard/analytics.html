<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics | Saasify AI</title>
    <script type="module" src='../../main.js'></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel='stylesheet' href='../../src/compiled-style.css'>
    <script>(function(){const t=localStorage.getItem('saasify-theme')||'light';if(t==='dark')document.documentElement.classList.add('dark');else document.documentElement.classList.remove('dark')})();</script>
</head>
<body class="bg-white dark:bg-slate-950 text-slate-900 dark:text-white font-sans antialiased overflow-hidden">
    <div class="noise-overlay"></div>
    <div id="sidebar-container"></div>

    <main class="ml-0 md:ml-64 transition-all duration-300 h-screen overflow-y-auto p-4 md:p-8">
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="font-display text-3xl font-bold">Analytics</h1>
                <p class="text-slate-500 dark:text-slate-400 text-sm">Deep insights into your AI operations.</p>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bento-card col-span-3 p-8">
                <h3 class="text-xs font-bold uppercase tracking-widest text-slate-500 mb-6">Token Usage over time</h3>
                <div class="h-80 relative">
                    <canvas id="revenue-chart"></canvas>
                </div>
            </div>
            
            <div class="bento-card p-6">
                <h3 class="text-sm font-bold mb-2">Cost Optimization</h3>
                <p class="text-2xl font-bold text-emerald-500">-$1,240</p>
                <p class="text-xs text-slate-500 mt-1">Saved via smart routing this month</p>
            </div>
            <div class="bento-card p-6">
                <h3 class="text-sm font-bold mb-2">Avg. Response Time</h3>
                <p class="text-2xl font-bold text-indigo-600">1.2s</p>
                <p class="text-xs text-slate-500 mt-1">-15% from last week</p>
            </div>
            <div class="bento-card p-6">
                <h3 class="text-sm font-bold mb-2">Error Rate</h3>
                <p class="text-2xl font-bold text-slate-900 dark:text-white">0.02%</p>
                <p class="text-xs text-slate-500 mt-1">Stable across all regions</p>
            </div>
        </div>
    </main>

    <div id="omni-bar"></div>
    <script type="module" src="./dashboard.js"></script>
</body>
</html>
