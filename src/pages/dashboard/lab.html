<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Lab | Saasify AI</title>
    <script type="module" src='../../main.js'></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel='stylesheet' href='../../src/compiled-style.css'>
    <script>(function(){const t=localStorage.getItem('saasify-theme')||'light';if(t==='dark')document.documentElement.classList.add('dark');else document.documentElement.classList.remove('dark')})();</script>
</head>
<body class="bg-white dark:bg-slate-950 text-slate-900 dark:text-white font-sans antialiased overflow-hidden">
    <div class="noise-overlay"></div>
    <div id="sidebar-container"></div>

    <main class="ml-0 md:ml-64 transition-all duration-300 h-screen overflow-y-auto p-4 md:p-8">
        <header class="mb-8">
            <h1 class="font-display text-3xl font-bold">AI Lab</h1>
            <p class="text-slate-500 dark:text-slate-400 text-sm">Experiment with different models and parameters.</p>
        </header>

        <div class="max-w-4xl mx-auto space-y-12">
            <div class="bento-card p-8">
                <h3 class="text-sm font-bold mb-6">Interactive Playground</h3>
                <div id="prompt-input-demo"></div>
            </div>

            <div class="bento-card p-8">
                <h3 class="text-sm font-bold mb-6">Output Preview</h3>
                <div id="syntax-terminal-demo"></div>
            </div>
        </div>
    </main>

    <div id="omni-bar"></div>
</body>
</html>
