<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | Saasify AI</title>
    <script type="module" src='../../main.js'></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel='stylesheet' href='../../compiled-style.css'>
    <script>(function(){const t=localStorage.getItem('saasify-theme')||'light';if(t==='dark')document.documentElement.classList.add('dark');else document.documentElement.classList.remove('dark')})();</script>
</head>
<body class="bg-white dark:bg-slate-950 text-slate-900 dark:text-white font-sans antialiased overflow-hidden">
    <div class="noise-overlay"></div>
    <div id="sidebar-container"></div>

    <main class="ml-0 md:ml-64 transition-all duration-300 h-screen overflow-y-auto p-4 md:p-8">
        <!-- Mobile Header -->
        <div class="md:hidden flex items-center justify-between mb-6">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white">S</div>
                <span class="font-display font-bold text-lg text-slate-900 dark:text-white">Saasify</span>
            </div>
            <button id="mobile-menu-btn" class="p-2 text-slate-400 hover:text-slate-900 dark:hover:text-white" aria-label="Toggle navigation">
                <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>
            </button>
        </div>

        <header class="mb-8">
            <h1 class="font-display text-3xl font-bold">Settings</h1>
            <p class="text-slate-500 dark:text-slate-400 text-sm">Manage your account and preferences.</p>
        </header>

        <div class="max-w-3xl space-y-8">
            <div class="bento-card p-8">
                <h3 class="text-lg font-bold mb-6">Profile Information</h3>
                <div class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-1">
                            <label class="text-xs font-bold text-slate-500 uppercase">First Name</label>
                            <input type="text" value="Jay" class="w-full px-4 py-2 rounded-lg bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10 outline-none">
                        </div>
                        <div class="space-y-1">
                            <label class="text-xs font-bold text-slate-500 uppercase">Last Name</label>
                            <input type="text" value="Shah" class="w-full px-4 py-2 rounded-lg bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10 outline-none">
                        </div>
                    </div>
                    <div class="space-y-1">
                        <label class="text-xs font-bold text-slate-500 uppercase">Email Address</label>
                        <input type="email" value="jay@example.com" class="w-full px-4 py-2 rounded-lg bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10 outline-none">
                    </div>
                    <button class="bg-indigo-600 text-white px-6 py-2 rounded-lg font-bold text-sm hover:bg-indigo-500 transition-all">Save Changes</button>
                </div>
            </div>

            <div class="bento-card p-8 border-red-500/20">
                <h3 class="text-lg font-bold text-red-500 mb-2">Danger Zone</h3>
                <p class="text-sm text-slate-500 mb-6">Once you delete your account, there is no going back. Please be certain.</p>
                <button class="px-6 py-2 border border-red-500 text-red-500 rounded-lg font-bold text-sm hover:bg-red-500 hover:text-white transition-all">Delete Account</button>
            </div>
        </div>
    </main>

    <div id="omni-bar"></div>
</body>
</html>
