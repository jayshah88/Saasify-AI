<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Management | Saasify AI</title>
    <script type="module" src='../../main.js'></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel='stylesheet' href='../../src/compiled-style.css'>
    <script>(function(){const t=localStorage.getItem('saasify-theme')||'light';if(t==='dark')document.documentElement.classList.add('dark');else document.documentElement.classList.remove('dark')})();</script>
</head>
<body class="bg-white dark:bg-slate-950 text-slate-900 dark:text-white font-sans antialiased overflow-hidden">
    <div class="noise-overlay"></div>
    <div id="sidebar-container"></div>

    <main class="ml-0 md:ml-64 transition-all duration-300 h-screen overflow-y-auto p-4 md:p-8">
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="font-display text-3xl font-bold">Team</h1>
                <p class="text-slate-500 dark:text-slate-400 text-sm">Manage team access and collaboration.</p>
            </div>
            <button class="bg-indigo-600 text-white px-6 py-2 rounded-xl font-bold text-sm shadow-lg shadow-indigo-500/20 hover:bg-indigo-500 transition-all">+ Invite Member</button>
        </header>

        <div class="bento-card overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-50 dark:bg-white/5 border-b border-slate-200 dark:border-white/10">
                        <th class="px-6 py-4 text-xs font-bold uppercase tracking-widest text-slate-500">Member</th>
                        <th class="px-6 py-4 text-xs font-bold uppercase tracking-widest text-slate-500">Role</th>
                        <th class="px-6 py-4 text-xs font-bold uppercase tracking-widest text-slate-500">Status</th>
                        <th class="px-6 py-4 text-xs font-bold uppercase tracking-widest text-slate-500 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 dark:divide-white/5">
                    <tr>
                        <td class="px-6 py-4 flex items-center gap-3">
                            <div class="w-8 h-8 rounded-lg bg-indigo-500/10 text-indigo-600 flex items-center justify-center font-bold text-xs">JS</div>
                            <div>
                                <p class="text-sm font-bold">Jay Shah</p>
                                <p class="text-[10px] text-slate-500">jay@example.com</p>
                            </div>
                        </td>
                        <td class="px-6 py-4 text-sm font-medium">Owner</td>
                        <td class="px-6 py-4"><span class="px-2 py-1 bg-emerald-500/10 text-emerald-500 text-[10px] font-bold uppercase rounded">Active</span></td>
                        <td class="px-6 py-4 text-right"><button class="text-slate-400 hover:text-slate-900 dark:hover:text-white">•••</button></td>
                    </tr>
                    <tr>
                        <td class="px-6 py-4 flex items-center gap-3">
                            <div class="w-8 h-8 rounded-lg bg-purple-500/10 text-purple-600 flex items-center justify-center font-bold text-xs">AM</div>
                            <div>
                                <p class="text-sm font-bold">Alex Morgan</p>
                                <p class="text-[10px] text-slate-500">alex@company.com</p>
                            </div>
                        </td>
                        <td class="px-6 py-4 text-sm font-medium">Developer</td>
                        <td class="px-6 py-4"><span class="px-2 py-1 bg-emerald-500/10 text-emerald-500 text-[10px] font-bold uppercase rounded">Active</span></td>
                        <td class="px-6 py-4 text-right"><button class="text-slate-400 hover:text-slate-900 dark:hover:text-white">•••</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <div id="omni-bar"></div>
</body>
</html>
