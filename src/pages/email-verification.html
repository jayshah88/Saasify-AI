<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Verify Email - Saasify AI</title>
    <!-- ThemeForest Standard: Local CSS -->
    <script type="module" src='../main.js'></script>
  <link rel='stylesheet' href='../compiled-style.css'>
  <script>(function(){const t=localStorage.getItem('saasify-theme')||'light';if(t==='dark')document.documentElement.classList.add('dark');else document.documentElement.classList.remove('dark')})();</script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 min-h-screen flex items-center justify-center font-sans">
    <div class="bg-white dark:bg-slate-900 p-8 rounded-2xl shadow-xl max-w-md w-full text-center border border-slate-200 dark:border-slate-800">
        <div class="w-16 h-16 bg-blue-100 dark:bg-blue-900/30 text-blue-600 rounded-full mx-auto flex items-center justify-center text-2xl mb-6">✉️</div>
        <h1 class="text-2xl font-bold text-slate-900 dark:text-white mb-2">Check your email</h1>
        <p class="text-slate-500 dark:text-slate-400 dark:text-slate-400 mb-6">We sent a verification link to <span class="font-bold text-slate-900 dark:text-white">user@example.com</span></p>
        
        <div class="text-sm text-slate-500 dark:text-slate-400 dark:text-slate-400">
            Didn't receive the email? <a href="#" class="text-indigo-600 font-medium hover:underline">Click to resend</a>
        </div>
        <div class="mt-8 pt-6 border-t border-slate-100 dark:border-slate-800">
            <a href="auth/login.html" class="text-sm text-slate-400 hover:text-slate-900 dark:hover:text-white">← Back to Login</a>
        </div>
    </div>
</body>
</html>
