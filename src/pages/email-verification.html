<body class="bg-neutral-50 dark:bg-neutral-950 min-h-screen flex items-center justify-center font-sans">

            <a href="login.html" class="text-sm text-neutral-400 hover:text-neutral-900 dark:hover:text-white">← Back to Login</a>
