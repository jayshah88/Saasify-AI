<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - Saasify AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <script type="module" src='../main.js'></script>
  <link rel='stylesheet' href='../compiled-style.css'>
  <script>(function(){const t=localStorage.getItem('saasify-theme')||'light';if(t==='dark')document.documentElement.classList.add('dark');else document.documentElement.classList.remove('dark')})();</script>
</head>

<body
    class="bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-50 antialiased transition-colors duration-300 font-sans">

    <div class="noise-overlay"></div>
    <main class="min-h-screen flex items-center justify-center bg-white dark:bg-slate-950 relative z-10">
        <div
            class="max-w-md w-full bg-white dark:bg-slate-900/50 backdrop-blur-xl p-8 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-800 animate-fade-in-up">
            <div class="text-center mb-8">
                <a href="index.html" class="inline-flex items-center gap-2 mb-6 group">
                    <div
                        class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-indigo-700 flex items-center justify-center text-white font-bold text-xl shadow-md group-hover:scale-105 transition-transform">
                        S</div>
                    <span class="font-display font-bold text-xl text-slate-900 dark:text-white">Saasify<span
                            class="text-indigo-500">.ai</span></span>
                </a>
                <h2 class="mt-2 text-3xl font-display font-bold text-slate-900 dark:text-white">Reset Password</h2>
                <p class="mt-2 text-sm text-slate-600 dark:text-slate-400">Enter your email and we'll send you a
                    link to
                    reset your password.</p>
            </div>
            <form class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Email
                        address</label>
                    <input type="email" required placeholder="name@company.com"
                        class="mt-1 block w-full px-3 py-2 border border-slate-300 dark:border-slate-700 rounded-md shadow-sm placeholder-slate-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 dark:bg-slate-800 dark:text-white sm:text-sm transition-colors">
                </div>
                <button type="submit"
                    class="group relative w-full flex justify-center py-2.5 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 shadow-lg shadow-indigo-500/30 transition-all duration-200">
                    Send reset link
                </button>
            </form>
            <div class="mt-6 text-center">
                <a href="auth/login.html" class="text-sm text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">Back
                    to Login</a>
            </div>
        </div>
    </main>
</body>

</html>
