<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - Saasify AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <!-- ThemeForest Standard: Local CSS -->
    <link href="css/style.css" rel="stylesheet">
</head>

<body
    class="bg-white dark:bg-neutral-950 text-neutral-900 dark:text-neutral-50 antialiased transition-colors duration-300 font-sans ">

    <div class="noise-overlay"></div>
    <div class="min-h-screen flex items-center justify-center bg-white dark:bg-neutral-950 relative z-10">
        <div
            class="max-w-md w-full bg-white dark:bg-neutral-900/50 backdrop-blur-xl p-8 rounded-2xl shadow-2xl border border-neutral-200 dark:border-neutral-800 animate-fade-in-up">
            <div class="text-center mb-8">
                <a href="index.html" class="inline-flex items-center gap-2 mb-6 group">
                    <div
                        class="w-8 h-8 rounded-lg bg-gradient-to-br from-primary-500 to-secondary-600 flex items-center justify-center text-white font-bold text-xl group-hover:scale-105 transition-transform">
                        S</div>
                    <span class="font-display font-bold text-xl text-neutral-900 dark:text-white">Saasify<span
                            class="text-primary-500">.ai</span></span>
                </a>
                <h2 class="mt-2 text-3xl font-display font-bold text-neutral-900 dark:text-white">Reset Password</h2>
                <p class="mt-2 text-sm text-neutral-600 dark:text-neutral-400">Enter your email and we'll send you a
                    link to
                    reset your password.</p>
            </div>
            <form class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-1">Email
                        address</label>
                    <input type="email" required placeholder="name@company.com"
                        class="mt-1 block w-full px-3 py-2 border border-neutral-300 dark:border-neutral-700 rounded-md shadow-sm placeholder-neutral-400 focus:outline-none focus:ring-primary-500 focus:border-primary-500 dark:bg-neutral-800 dark:text-white sm:text-sm transition-colors">
                </div>
                <button type="submit"
                    class="group relative w-full flex justify-center py-2.5 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 shadow-lg shadow-primary-500/30 transition-all duration-200">
                    Send reset link
                </button>
            </form>
            <div class="mt-6 text-center">
                <a href="login.html" class="text-sm text-neutral-500 hover:text-neutral-900 dark:hover:text-white">Back
                    to Login</a>
            </div>
        </div>
        <script src="js/main.js"></script>
</body>

</html>
